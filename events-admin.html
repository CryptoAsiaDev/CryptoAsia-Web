<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Events Admin | Crypto Asia</title>
<link rel="icon" type="image/png" sizes="32x32" href="logos/favicon-32.png">
<script>var t='dark';try{t=localStorage.getItem('ca-theme')||'dark'}catch(e){}document.documentElement.setAttribute('data-theme',t)</script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.row{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--gold);padding:1rem 1.2rem;margin-bottom:.8rem}
.row h3{font-family:var(--fh);font-size:.95rem;margin-bottom:.3rem}
.row .m{font-family:var(--fm);font-size:.8rem;color:var(--text2);letter-spacing:.05em;margin:.2rem 0}
.row .btns{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
.tabs{display:flex;gap:.5rem;margin:1.2rem 0;flex-wrap:wrap}
</style>
</head>
<body>
<div id="site-nav"></div>
<main>
  <h1>EVENTS <span class="gold">ADMIN</span></h1>
  <p class="note">Only you can use this page. Sign in with the Supabase user you created (Authentication → Users). Anyone else gets nothing, because the database only lets a signed-in user see pending events.</p>
  <form id="login" style="max-width:420px;margin-top:1rem">
    <div class="field"><label class="label" for="em">Email</label><input class="input" id="em" type="email" autocomplete="username"></div>
    <div class="field"><label class="label" for="pw">Password</label><input class="input" id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn" type="submit">Sign in</button> <span id="lmsg" class="note"></span>
  </form>
  <div id="panel" hidden>
    <div class="tabs" id="tabs"></div>
    <div id="rows"></div>
    <button class="btn ghost" id="out" type="button" style="margin-top:1rem">Sign out</button>
  </div>
</main>
<div id="site-foot"></div>
<script src="shared.js"></script>
<script>
(function(){
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  var CFG = {}, tok = '', tab = 'pending';
  try { tok = sessionStorage.getItem('ca-adm') || ''; } catch(e){}
  function base(){ return CFG.supabaseUrl.replace(/\/$/,''); }
  function api(path, o){ o = o||{}; return fetch(base()+path, {method:o.method||'GET', headers:{apikey:CFG.supabaseKey, Authorization:'Bearer '+tok, 'content-type':'application/json', Prefer:'return=minimal'}, body:o.body}); }
  function tabs(){
    $('tabs').innerHTML = ['pending','approved','rejected','reports'].map(function(t){ return '<button type="button" class="btn '+(t===tab?'':'ghost')+'" data-t="'+t+'">'+t+'</button>'; }).join('');
  }
  function load(){
    tabs();
    if (tab==='reports') {
      api('/rest/v1/event_reports?select=id,reason,created_at,events(id,title,url,status)&order=created_at.desc&limit=100').then(r=>r.json()).then(function(a){
        $('rows').innerHTML = a.length ? a.map(function(x){ var e = x.events||{}; return '<div class="row"><h3>'+esc(e.title)+'</h3><div class="m">'+esc(x.reason||'(no reason)')+' · '+esc(x.created_at.slice(0,10))+'</div><div class="m"><a href="'+esc(e.url)+'" target="_blank" rel="noopener">'+esc(e.url)+'</a></div><div class="btns"><button class="btn dark" data-act="rejected" data-id="'+esc(e.id)+'">Take down</button><button class="btn ghost" data-del="'+esc(x.id)+'">Dismiss report</button></div></div>'; }).join('') : '<p>No reports.</p>';
      });
      return;
    }
    api('/rest/v1/events?select=*&status=eq.'+tab+'&order=created_at.desc&limit=100').then(function(r){ if (r.status===401) { signout(); throw 0; } return r.json(); }).then(function(a){
      $('rows').innerHTML = a.length ? a.map(function(e){
        return '<div class="row"><h3>'+esc(e.title)+'</h3><div class="m">'+esc(e.type)+' · '+esc(e.starts_on)+' → '+esc(e.ends_on)+' · '+esc(e.online?'Online':[e.city,e.country].filter(Boolean).join(', '))+'</div>'+
        '<div class="m">By '+esc(e.organizer)+' · contact: '+esc(e.contact||'-')+'</div><div class="m"><a href="'+esc(e.url)+'" target="_blank" rel="noopener nofollow">'+esc(e.url)+'</a></div><p>'+esc(e.description)+'</p>'+
        '<div class="btns">'+(tab!=='approved'?'<button class="btn" data-act="approved" data-id="'+e.id+'">Approve</button>':'<button class="btn dark" data-feat="'+(e.featured?0:1)+'" data-id="'+e.id+'">'+(e.featured?'Unfeature':'Feature')+'</button>')+
        (tab!=='rejected'?'<button class="btn ghost" data-act="rejected" data-id="'+e.id+'">Reject</button>':'')+'</div></div>'; }).join('') : '<p>Nothing here.</p>';
    }).catch(function(){});
  }
  function show(){ $('login').hidden = !!tok; $('panel').hidden = !tok; if (tok) load(); }
  function signout(){ tok=''; try{ sessionStorage.removeItem('ca-adm'); }catch(e){} show(); }
  $('out').onclick = signout;
  $('tabs').onclick = function(e){ var b = e.target.closest('[data-t]'); if (b){ tab = b.getAttribute('data-t'); load(); } };
  $('rows').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var id = b.getAttribute('data-id'), p;
    if (b.getAttribute('data-act')) p = api('/rest/v1/events?id=eq.'+id, {method:'PATCH', body:JSON.stringify({status:b.getAttribute('data-act')})});
    else if (b.hasAttribute('data-feat')) p = api('/rest/v1/events?id=eq.'+id, {method:'PATCH', body:JSON.stringify({featured:b.getAttribute('data-feat')==='1'})});
    else if (b.getAttribute('data-del')) p = api('/rest/v1/event_reports?id=eq.'+b.getAttribute('data-del'), {method:'DELETE'});
    if (p) p.then(load);
  });
  $('login').addEventListener('submit', function(e){
    e.preventDefault(); $('lmsg').textContent = 'Signing in…';
    fetch(base()+'/auth/v1/token?grant_type=password', {method:'POST', headers:{apikey:CFG.supabaseKey,'content-type':'application/json'}, body:JSON.stringify({email:$('em').value.trim(), password:$('pw').value})})
      .then(function(r){ return r.json(); }).then(function(j){
        if (!j.access_token) { $('lmsg').textContent = 'Sign-in failed.'; return; }
        tok = j.access_token; try{ sessionStorage.setItem('ca-adm', tok); }catch(x){} $('pw').value=''; $('lmsg').textContent=''; show();
      }).catch(function(){ $('lmsg').textContent = 'Network problem.'; });
  });
  fetch('jobs-config.json').then(r=>r.json()).catch(function(){return {};}).then(function(c){
    CFG = c; if (!c.supabaseUrl || !c.supabaseKey) { $('login').hidden = true; $('lmsg').textContent=''; $('panel').hidden = true; document.querySelector('main').insertAdjacentHTML('beforeend','<p>Supabase is not set up yet (see jobs-config.json).</p>'); return; }
    show();
  });
})();
</script>
</body>
</html>
