name: Update perp DEX data

on:
  schedule:
    - cron: '15 0 * * *'       # 08:15 Kuala Lumpur, every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch perp data
        run: node scripts/fetch-perps.mjs
        env:
          DEFILLAMA_API_KEY: ${{ secrets.DEFILLAMA_API_KEY }}
      - name: Commit
        run: |
          git config user.name "crypto-asia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add perps-data.json data/perps-history.json
          git diff --cached --quiet || git commit -m "Update perp data"
          git push
