name: Update crypto news

on:
  schedule:
    - cron: '0 23 * * *'       # 07:00 Kuala Lumpur
    - cron: '0 11 * * *'       # 19:00 Kuala Lumpur (twice a day)
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install parser
        run: npm install --no-save --no-audit --no-fund fast-xml-parser@4

      - name: Fetch feeds and write briefs
        run: node scripts/fetch-news.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_MAX_NEW: '20'      # runs are 12 hours apart, so allow more briefs per run
          NEWS_PER_FEED: '15'     # and read more of each feed

      - name: Build RSS feed
        run: node scripts/make-feed.mjs

      - name: Commit news.json if it changed
        run: |
          if [[ -n "$(git status --porcelain news.json feed.xml)" ]]; then
            git config user.name "crypto-asia-bot"
            git config user.email "bot@users.noreply.github.com"
            git add news.json feed.xml
            git commit -m "Update news"
            git pull --rebase
            git push
          else
            echo "No changes to publish."
          fi
