name: Post news to X, Facebook and Telegram

on:
  schedule:
    # 3 posts a day (Kuala Lumpur 08:10, 14:20 and 20:05), after the news runs at 07:00 and 19:00
    - cron: '10 0 * * *'
    - cron: '20 6 * * *'
    - cron: '5 12 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = write the tweet but do not post it'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: post-x
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pick the biggest story and post it
        run: node scripts/post-x.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MAX_PER_DAY: '3'
          X_INCLUDE_LINK: 'false'
      - name: Save the posted list
        run: |
          git config user.name "crypto-asia-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/x-posted.json
          git diff --cached --quiet || (git commit -m "Record posted tweet" && git pull --rebase && git push)
